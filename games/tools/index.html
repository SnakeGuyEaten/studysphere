<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student RPG OS</title>


<style>
:root{
  --blue:#4da3ff;
  --glass:rgba(255,255,255,0.6);
}


body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
  background:linear-gradient(135deg,#fff,#cfe8ff,#4da3ff);
  background-size:cover;
  background-position:center;
}


/* SIDEBAR */
#sidebar{
  width:220px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(10px);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}


#sidebar button{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}


/* MAIN */
#main{
  flex:1;
  padding:20px;
  overflow:auto;
}


.app{display:none;}
.active{display:block;}


.card{
  background:var(--glass);
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  border-left:4px solid var(--blue);
}


/* CALENDAR */
#calendarGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}


.dayCell{
  min-height:80px;
  background:rgba(255,255,255,0.75);
  border:1px solid #ddd;
  border-radius:8px;
  padding:5px;
  cursor:pointer;
  font-size:12px;
}


/* POPUP */
#eventBox{
  margin-top:10px;
  padding:10px;
  background:rgba(255,255,255,0.9);
  border-radius:10px;
  display:none;
}

/* SMOOTH APP FEEL */
.app.active {
  animation: fadeUp 0.45s ease forwards;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card,
.dayCell,
#eventBox {
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

.card:hover,
.dayCell:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 8px 20px rgba(77,163,255,0.25);
}

/* SIDEBAR BUTTON ANIMATION */
#sidebar button {
  transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
}

#sidebar button:hover {
  transform: translateX(5px);
  background: rgba(77,163,255,0.35);
  box-shadow: 0 6px 16px rgba(77,163,255,0.25);
}

/* INPUT FOCUS GLOW */
input,
textarea {
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 10px rgba(77,163,255,0.35);
}

/* CALCULATOR BUTTON FEEL */
#calculator button {
  background: rgba(77,163,255,0.25);
  border: 1px solid rgba(77,163,255,0.4);
  border-radius: 8px;
  transition: transform 0.2s ease, background 0.2s ease;
}

#calculator button:hover {
  transform: translateY(-2px);
  background: rgba(77,163,255,0.45);
}

/* NOTES PERIOD BUTTONS */
#periodBar button {
  background: rgba(77,163,255,0.25);
  border: 1px solid rgba(77,163,255,0.4);
  border-radius: 8px;
  transition: transform 0.2s ease, background 0.2s ease;
}

#periodBar button:hover {
  transform: translateY(-2px);
  background: rgba(77,163,255,0.45);
}

</style>


</head>


<body>


<div id="sidebar">
<button onclick="show('dash')">📊 Dashboard</button>
<button onclick="show('quests')">🎯 Quests</button>
<button onclick="show('notes')">📝 Notes</button>
<button onclick="show('calculator')">🧮 Calculator</button>
<button onclick="show('calendar')">📅 Calendar</button>
<button onclick="show('settings')">🎨 Personalization</button>
</div>


<div id="main">


<!-- DASH -->
<div id="dash" class="app active">
<h2>Dashboard</h2>
<div class="card">Level: <span id="level"></span></div>
<div class="card">XP: <span id="xp"></span></div>
<div class="card">Coins: <span id="coins"></span></div>
</div>


<!-- QUESTS -->
<div id="quests" class="app">
<h2>Quests</h2>
<input id="questInput" placeholder="Add quest (Enter works)">
<button onclick="addQuest()">Add</button>
<div id="questList"></div>
</div>


<!-- NOTES -->
<div id="notes" class="app">
<h2>Notes</h2>


<div id="periodBar"></div>


<br>
<input id="periodName" placeholder="Rename subject (Enter works)">
<button onclick="renamePeriod()">Rename</button>


<br><br>


<textarea id="notesBox" style="width:100%;height:200px;"></textarea>
</div>


<!-- CALCULATOR -->
<div id="calculator" class="app">
<h2>Scientific Calculator</h2>


<input id="display" readonly style="width:260px;">
<br><br>


<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">÷</button><br>


<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">×</button><br>


<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">−</button><br>


<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button onclick="press('+')">+</button>
<button onclick="press('(')">(</button>
<button onclick="press(')')">)</button><br>


<button onclick="press('Math.sin(')">sin</button>
<button onclick="press('Math.cos(')">cos</button>
<button onclick="press('Math.tan(')">tan</button>
<button onclick="press('**2')">x²</button><br>


<button onclick="calc()">=</button>
<button onclick="clearCalc()">Clear</button>
</div>


<!-- CALENDAR -->
<div id="calendar" class="app">
<h2>Calendar</h2>


<button onclick="prevMonth()">⬅</button>
<span id="monthLabel"></span>
<button onclick="nextMonth()">➡</button>


<div id="calendarGrid"></div>


<div id="eventBox">
  <h3>Add Event</h3>
  <div id="selectedDateLabel"></div>
  <input id="eventText" placeholder="Press Enter to save">
  <button onclick="saveEvent()">Save</button>
  <button onclick="closeEvent()">Cancel</button>
</div>
</div>


<!-- SETTINGS -->
<div id="settings" class="app">
<h2>Personalization</h2>
<input type="file" id="bgUpload">
<br><br>
<button onclick="resetBackground()">Reset Background</button>
</div>


</div>


<script>


/* NAV */
function show(id){
  document.querySelectorAll('.app').forEach(a=>{
    a.classList.remove('active');
  });

  const app = document.getElementById(id);
  app.classList.add('active');
}


/* DATA */
let xp=0, coins=0, quests=[];


/* NOTES */
let periods={
  1:{name:"Math",notes:""},
  2:{name:"Science",notes:""},
  3:{name:"English",notes:""},
  4:{name:"History",notes:""},
  5:{name:"PE",notes:""},
  6:{name:"Art",notes:""},
  7:{name:"Elective",notes:""}
};


let current=1;


/* CALENDAR */
let events={};
let currentDate=new Date();
let selectedDate=null;


/* SAVE */
function save(){
  localStorage.setItem("rpg", JSON.stringify({
    xp, coins, quests, periods, events,
    bg: bgData || null
  }));
}


/* LOAD */
let bgData=null;


function load(){
  let d=JSON.parse(localStorage.getItem("rpg"));
  if(!d) return;


  xp=d.xp;
  coins=d.coins;
  quests=d.quests||[];
  periods=d.periods||periods;
  events=d.events||{};


  if(d.bg){
    bgData=d.bg;
    document.body.style.backgroundImage=`url(${bgData})`;
  }
}


/* LEVEL */
function level(){return Math.floor(xp/100)+1;}


/* UPDATE */
function update(){
  xpEl.innerText=xp;
  coinsEl.innerText=coins;
  levelEl.innerText=level();
  save();
}


/* QUESTS */
function addQuest(){
  let v=questInput.value.trim();
  if(!v) return;
  quests.push(v);
  questInput.value="";
  renderQuests();
}


questInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") addQuest();
});


function renderQuests(){
  questList.innerHTML="";
  quests.forEach((q,i)=>{
    let d=document.createElement("div");
    d.className="card";


    let cb=document.createElement("input");
    cb.type="checkbox";
    cb.onchange=()=>{
      xp+=15;
      coins+=8;
      quests.splice(i,1);
      renderQuests();
      update();
    };


    let del=document.createElement("button");
    del.innerText="Delete";
    del.onclick=()=>{
      quests.splice(i,1);
      renderQuests();
    };


    d.append(cb," "+q,del);
    questList.appendChild(d);
  });
}


/* NOTES */
function renderPeriods(){
  periodBar.innerHTML="";
  for(let i=1;i<=7;i++){
    let b=document.createElement("button");
    b.innerText=periods[i].name;
    b.onclick=()=>{current=i;loadNotes();};
    periodBar.appendChild(b);
  }
}


function loadNotes(){
  notesBox.value=periods[current].notes;
  periodName.value=periods[current].name;
}


notesBox.oninput=()=>{
  periods[current].notes=notesBox.value;
};


periodName.addEventListener("keydown",e=>{
  if(e.key==="Enter") renamePeriod();
});


function renamePeriod(){
  periods[current].name=periodName.value;
  renderPeriods();
}


/* CALENDAR */
function renderCalendar(){
  let grid=document.getElementById("calendarGrid");
  grid.innerHTML="";


  let y=currentDate.getFullYear();
  let m=currentDate.getMonth();


  let first=new Date(y,m,1);
  let last=new Date(y,m+1,0);


  monthLabel.innerText=
    first.toLocaleString('default',{month:'long'})+" "+y;


  let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];


  days.forEach(d=>{
    let h=document.createElement("div");
    h.innerText=d;
    h.style.fontWeight="bold";
    grid.appendChild(h);
  });


  for(let i=0;i<first.getDay();i++){
    grid.appendChild(document.createElement("div"));
  }


  for(let d=1;d<=last.getDate();d++){
    let cell=document.createElement("div");
    cell.className="dayCell";


    let key=`${y}-${m+1}-${d}`;
    cell.innerHTML="<b>"+d+"</b><br>";


    if(events[key]){
      events[key].forEach(e=>{
        let ev=document.createElement("div");
        ev.innerText="• "+e;
        cell.appendChild(ev);
      });
    }


    cell.onclick=()=>openEvent(key);
    grid.appendChild(cell);
  }
}


function nextMonth(){currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();}
function prevMonth(){currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();}


/* EVENTS */
function openEvent(date){
  selectedDate=date;
  eventBox.style.display="block";
  selectedDateLabel.innerText=date;
}


function closeEvent(){
  eventBox.style.display="none";
  eventText.value="";
}


function saveEvent(){
  let v=eventText.value.trim();
  if(!v) return;


  if(!events[selectedDate]) events[selectedDate]=[];
  events[selectedDate].push(v);


  closeEvent();
  renderCalendar();
}


/* BG UPLOAD FIXED */
bgUpload.addEventListener("change",e=>{
  let file=e.target.files[0];
  let reader=new FileReader();


  reader.onload=function(){
    bgData=reader.result;
    document.body.style.backgroundImage=`url(${bgData})`;
    save();
  };


  reader.readAsDataURL(file);
});


/* RESET FIXED */
function resetBackground(){
  localStorage.removeItem("rpg");
  location.reload();
}


/* CALC */
let expr="";
function press(v){expr+=v;display.value=expr;}
function clearCalc(){expr="";display.value="";}
function calc(){
  try{
    display.value=eval(expr);
    expr=display.value;
  }catch{
    display.value="Error";
    expr="";
  }
}


/* INIT */
const xpEl=document.getElementById("xp");
const coinsEl=document.getElementById("coins");
const levelEl=document.getElementById("level");


load();
renderPeriods();
loadNotes();
renderQuests();
renderCalendar();
update();


</script>


</body>
</html>
