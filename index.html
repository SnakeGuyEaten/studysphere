<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudySphere</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #ffffff, #4da3ff);
  color: #1a1a1a;
  animation: fadeInBody 0.6s ease;
}

@keyframes fadeInBody {
  from { opacity: 0; }
  to { opacity: 1; }
}

header {
  background: rgba(255, 255, 255, 0.6);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(10px);
  animation: slideDown 0.6s ease;
}

@keyframes slideDown {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

h1 {
  margin: 0;
}

#modes {
  text-align: center;
  margin-top: 10px;
  animation: fadeUp 0.7s ease;
}

.mode-btn {
  padding: 10px 14px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #4da3ff;
  color: white;
  transition: transform 0.2s ease, background 0.2s ease;
}

.mode-btn:hover {
  transform: translateY(-2px);
}

.mode-btn.active {
  background: #2f85e6;
}

#notice {
  text-align: center;
  margin-top: 5px;
  font-size: 14px;
  opacity: 0.8;
}

#games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
  padding: 25px;
  transition: opacity 0.25s ease;
}

.card {
  background: rgba(255,255,255,0.8);
  border-radius: 16px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.55s ease forwards;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card:hover {
  transform: translateY(-6px) scale(1.04);
  box-shadow: 0 10px 25px rgba(77,163,255,0.3);
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 12px;
  margin-bottom: 10px;
  padding: 8px;
  box-sizing: border-box;
}

.card:hover img {
  transform: scale(1.04);
}

.card h3 {
  margin: 5px 0 0 0;
  font-size: 16px;
}

#viewer {
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
}

#viewer.show {
  opacity: 1;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#back {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 10px;
  background: #4da3ff;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  z-index: 10;
  transition: transform 0.2s ease, background 0.2s ease;
}

#back:hover {
  transform: scale(1.05);
  background: #2f85e6;
}
</style>
</head>

<body>

<header>
  <h1>StudySphere</h1>
</header>

<div id="modes">
  <button class="mode-btn active" id="schoolBtn" onclick="setMode('school')">🏫 School Mode</button>
  <button class="mode-btn" id="homeBtn" onclick="setMode('home')">🏠 Home Mode</button>
</div>

<div id="notice"></div>

<div id="games"></div>

<div id="viewer">
  <button id="back">⬅ Back</button>
  <iframe id="frame"></iframe>
</div>

<script>
let mode = "school";

const apps = [
  {
    name: "Pomodoro Timer",
    url: "games/pomodoro/index.html",
    icon: "icons/tomato.png",
    type: "tool"
  },
  {
    name: "Calculator / Tools",
    url: "games/tools/index.html",
    icon: "icons/inspire-studio-calculate-6780397_1920.png",
    type: "tool"
  },
  {
    name: "Soundboard",
    url: "games/soundboard/index.html",
    icon: "icons/soundboard.png",
    type: "tool"
  },
  {
    name: "2048",
    url: "games/2048/index.html",
    icon: "icons/2048.png",
    type: "game"
  },
  {
    name: "HexGL Racing",
    url: "games/hexgl/index.html",
    icon: "icons/hexgl.png",
    type: "game"
  }
];

const container = document.getElementById("games");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");
const notice = document.getElementById("notice");

function render() {
  container.innerHTML = "";

  let filtered = apps.filter(app => {
    if (mode === "school") return app.type === "tool";
    return true;
  });

  filtered.forEach((app, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (index * 0.08) + "s";

    card.innerHTML = `
      <img src="${app.icon}" alt="${app.name}">
      <h3>${app.name}</h3>
    `;

    card.onclick = () => {
      frame.src = app.url + "?mode=" + mode;
      viewer.style.display = "block";

      setTimeout(() => {
        viewer.classList.add("show");
      }, 10);
    };

    container.appendChild(card);
  });

  notice.innerText =
    mode === "school"
      ? "🏫 School Mode: Eliminated distractions."
      : "🏠 Home Mode: Full access enabled.";
}

function setMode(newMode) {
  mode = newMode;

  document.getElementById("schoolBtn").classList.remove("active");
  document.getElementById("homeBtn").classList.remove("active");
  document.getElementById(newMode + "Btn").classList.add("active");

  container.style.opacity = "0";

  setTimeout(() => {
    render();
    container.style.opacity = "1";
  }, 200);
}

document.getElementById("back").onclick = () => {
  viewer.classList.remove("show");

  setTimeout(() => {
    viewer.style.display = "none";
    frame.src = "";
  }, 300);
};

render();
</script>

</body>
</html>
